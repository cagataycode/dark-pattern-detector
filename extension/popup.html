<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px 16px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f3f5; }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid #f1f3f5; }
    li:last-child { border-bottom: 0; }
    .n { font-weight: 600; }
    .muted { color: #868e96; font-size: 12px; }
    .high { color: #e8590c; }
    .medium { color: #f08c00; }
  </style>
</head>
<body>
  <h1>Dark Pattern Detector</h1>
  <label class="toggle">Show warnings on pages <input type="checkbox" id="enabled"></label>
  <div id="status" class="muted" style="margin-top:8px"></div>
  <ul id="list"></ul>
  <div id="diag" class="muted" style="margin-top:8px;font-size:11px"></div>
  <script src="patterns.js"></script>
  <script src="popup.js"></script>
</body>
</html>
